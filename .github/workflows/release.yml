name: Release

# Builds an installer and a portable download for every platform from the tagged source:
# Windows (setup exe and portable zip, x64 and ARM64), Linux (install.sh tarball, .deb,
# portable tarball, and an Arch .pkg.tar.zst when it builds) and macOS (disk image and portable zip, Apple silicon and Intel), then attaches them all to the GitHub release for that tag.
# Releases are written as drafts (with notes) and published here only once every
# file is attached, so the app's updater, which reads the latest published release,
# never sees one without them. If no release exists yet, one is created as a draft
# to be given notes and published by hand.
#
# Nightly: at 11:47 PM Central, if main has changes to the app (its code, assets, build
# or packaging) that no release or nightly was built from, the same
# files are built from it as version <version>-nightly.<date> (YTM_NIGHTLY tells the app
# it's a nightly) and published as a prerelease, tagged v<version>-nightly.<date>, with
# the commits since the last release or nightly as its notes. The app's nightly channel
# reads those; the latest release is never one of them. Only the newest few are kept.
on:
  push:
    tags: ["v*"]
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs near it.
    - cron: "47 23 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Publish a nightly from this branch"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # What goes into the downloads: the code, assets, build and packaging. Only changes
  # here make a nightly, or appear in its notes; the site, docs, Markdown, the worker in
  # server/, .github and the like don't change the app.
  APP_PATHS: "src assets build.rs Cargo.toml Cargo.lock installer linux macos :(exclude)*.md"

jobs:
  # The version to build, and for a nightly its build number, or whether there's
  # nothing new to build one from.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      nightly: ${{ steps.v.outputs.nightly }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: v
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$NIGHTLY" != true ]; then
            echo "version=$cargo_ver" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD already has a release or nightly: $(git tag --points-at HEAD 'v*')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing to build if nothing in the app changed (APP_PATHS).
          read -ra app <<< "$APP_PATHS"
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$prev" ] && [ -z "$(git diff --name-only "$prev" HEAD -- "${app[@]}")" ]; then
            echo "Nothing in the app changed since $prev"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The date (Central, like the schedule), and a second number if there's already
          # a nightly from that day.
          day=$(TZ=America/Chicago date +%Y%m%d)
          build=$day
          n=1
          while git rev-parse -q --verify "refs/tags/v$cargo_ver-nightly.$build" >/dev/null; do
            n=$((n + 1)); build="$day.$n"
          done
          echo "Nightly $cargo_ver-nightly.$build"
          echo "version=$cargo_ver-nightly.$build" >> "$GITHUB_OUTPUT"
          echo "nightly=$build" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      YTM_NIGHTLY: ${{ needs.prepare.outputs.nightly }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Check versions match
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          iss_ver=$(grep -m1 '#define AppVersion' installer/ytm-rs.iss | cut -d'"' -f2)
          echo "Cargo.toml $cargo_ver, ytm-rs.iss $iss_ver"
          [ "$cargo_ver" = "$iss_ver" ] || { echo "version mismatch"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$cargo_ver"; exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      # Cross-compiled on the x64 runner, whose Visual Studio has the ARM64 tools.
      - name: Build ARM64
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" installer\ytm-rs.iss
          if ($LASTEXITCODE) { exit 1 }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DArm64 "/DAppVersion=$env:VERSION" installer\ytm-rs.iss
          if ($LASTEXITCODE) { exit 1 }

      # The portable zips: the exe, the marker that makes it portable, README and LICENSE.
      - name: Build portable zips
        run: |
          foreach ($b in @(@{ dir = "target\release"; suffix = "" }, @{ dir = "target\aarch64-pc-windows-msvc\release"; suffix = "-arm64" })) {
            $out = "installer\Output\portable$($b.suffix)"
            New-Item -ItemType Directory -Force $out | Out-Null
            Copy-Item "$($b.dir)\ytm-rs.exe", installer\portable.txt, README.md, LICENSE $out
            & "$env:SystemRoot\System32\tar.exe" -a -c -f "installer\Output\ytm-rs-portable-$env:VERSION$($b.suffix).zip" -C $out ytm-rs.exe portable.txt README.md LICENSE
            if ($LASTEXITCODE) { exit 1 }
          }

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            installer/Output/ytm-rs-setup-${{ env.VERSION }}.exe
            installer/Output/ytm-rs-portable-${{ env.VERSION }}.zip
            installer/Output/ytm-rs-setup-${{ env.VERSION }}-arm64.exe
            installer/Output/ytm-rs-portable-${{ env.VERSION }}-arm64.zip
          if-no-files-found: error

  linux:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      YTM_NIGHTLY: ${{ needs.prepare.outputs.nightly }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev dpkg-dev

      - name: Build
        run: cargo build --release --locked

      # The installer tarball: the binary, install.sh with the launcher and icon it
      # installs, README and LICENSE. The portable one: the binary, the marker that makes
      # it portable, README and LICENSE. The updater on Linux reads them too.
      - name: Build tarballs
        run: |
          dir="ytm-rs-$VERSION-linux-x86_64"
          mkdir -p "out/$dir"
          cp target/release/ytm-rs linux/install.sh linux/ytm-rs.desktop README.md LICENSE "out/$dir/"
          cp assets/icon/icon.png "out/$dir/ytm-rs.png"
          chmod 755 "out/$dir/ytm-rs" "out/$dir/install.sh"
          tar -czf "out/$dir.tar.gz" -C out "$dir"
          dir="ytm-rs-portable-$VERSION-linux-x86_64"
          mkdir -p "out/$dir"
          cp target/release/ytm-rs linux/portable.txt README.md LICENSE "out/$dir/"
          chmod 755 "out/$dir/ytm-rs"
          tar -czf "out/$dir.tar.gz" -C out "$dir"

      # The .deb (ytm-rs_<version>_amd64.deb, a nightly's as <version>+nightly.<date>),
      # which installs over the last one. It tells you about new versions rather than
      # updating itself.
      - name: Build the .deb
        run: sh linux/deb.sh target/release/ytm-rs "$VERSION" out

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            out/ytm-rs-${{ env.VERSION }}-linux-x86_64.tar.gz
            out/ytm-rs-portable-${{ env.VERSION }}-linux-x86_64.tar.gz
            out/ytm-rs_*_amd64.deb
          if-no-files-found: error

  # Built on archlinux:latest, which moves under it: if this fails, the release and the
  # nightly still go out, just without the Arch package.
  arch:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      YTM_NIGHTLY: ${{ needs.prepare.outputs.nightly }}
    steps:
      - uses: actions/checkout@v5

      # Build against Arch's current libraries, rather than repackaging the
      # Ubuntu binary. makepkg produces a pacman-installable .pkg.tar.zst
      # (ytm-rs-<version>-1-x86_64.pkg.tar.zst, a nightly's as <version>.nightly.<date>),
      # which tells you about new versions rather than updating itself.
      - name: Build the Arch package
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e YTM_NIGHTLY \
            archlinux:latest bash linux/arch.sh "$VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: arch
          path: out/ytm-rs-*-x86_64.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VERSION: ${{ needs.prepare.outputs.version }}
      YTM_NIGHTLY: ${{ needs.prepare.outputs.nightly }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # The tests run on the Apple silicon runner itself; a release isn't published
      # without them passing.
      - name: Test
        run: cargo test --locked --target aarch64-apple-darwin

      # The Intel build is cross-compiled on the Apple silicon runner.
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # Per architecture, the installer: a disk image with the app and an Applications
      # link to drag it to. And the portable zip: the app with the portable marker,
      # README and LICENSE. The updater on macOS reads them too.
      - name: Build installers and portable zips
        run: |
          for arch in aarch64 x86_64; do
            bin="target/$arch-apple-darwin/release/ytm-rs"
            stage="out/dmg-$arch"
            dmg="out/ytm-rs-setup-$VERSION-macos-$arch.dmg"
            mkdir -p "$stage"
            sh macos/bundle.sh "$bin" "$VERSION" "$stage"
            ln -s /Applications "$stage/Applications"
            # hdiutil on the hosted runners sometimes fails with "Resource busy"; retry.
            for try in 1 2 3; do
              hdiutil create -volname "YT Music" -srcfolder "$stage" -ov -format UDZO "$dmg" && break
              sleep 10
            done
            [ -f "$dmg" ]
            dir="ytm-rs-portable-$VERSION-macos-$arch"
            mkdir -p "out/$dir"
            sh macos/bundle.sh "$bin" "$VERSION" "out/$dir" portable
            cp README.md LICENSE "out/$dir/"
            ditto -c -k --norsrc --keepParent "out/$dir" "out/$dir.zip"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            out/ytm-rs-setup-${{ env.VERSION }}-macos-aarch64.dmg
            out/ytm-rs-portable-${{ env.VERSION }}-macos-aarch64.zip
            out/ytm-rs-setup-${{ env.VERSION }}-macos-x86_64.dmg
            out/ytm-rs-portable-${{ env.VERSION }}-macos-x86_64.zip
          if-no-files-found: error

  # Waits for the Arch package, but goes ahead without it if it failed.
  attach:
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.prepare.outputs.nightly == '' &&
      needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success'
    needs: [prepare, windows, linux, arch, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l files
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" files/* --draft --title "ytm-rs ${GITHUB_REF_NAME#v}" --notes ""
          fi

  nightly:
    if: >-
      !cancelled() && needs.prepare.outputs.nightly != '' &&
      needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success'
    needs: [prepare, windows, linux, arch, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true

      # A draft until every file is attached, so the updater never sees it without them.
      # The notes: the commits since the last release or nightly that changed the app
      # (APP_PATHS), but version bumps and developer-only ones (Dev:, CI:, Tests:).
      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -l files
          tag="v$VERSION"
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          read -ra app <<< "$APP_PATHS"
          {
            echo "A nightly build of the newest changes. It may have rough edges."
            if [ -n "$prev" ]; then
              echo
              echo "Since ${prev#v}:"
              echo
              git log --no-merges --format='- %s' "$prev..HEAD" -- "${app[@]}" | grep -vE '^- ([0-9]+\.[0-9]+\.[0-9]+|(Dev|CI|Tests?): .*)$' || true
            fi
          } > notes.md
          cat notes.md
          gh release create "$tag" files/* --draft --prerelease --target "$GITHUB_SHA" --title "ytm-rs $VERSION" --notes-file notes.md
          gh release edit "$tag" --draft=false --prerelease

      # The newest few nightlies are plenty; delete the rest, tags too.
      - name: Remove old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
          while read -r tag; do
            echo "removing $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
