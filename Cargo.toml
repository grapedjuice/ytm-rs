[package]
name = "ytm-rs"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/grapedjuice/ytm-rs"
description = "Native YouTube Music client"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
discord-rich-presence = "1.1.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu_no_default_features", "default_fonts", "system_fonts", "links", "clipboard", "accesskit", "persistence", "wayland", "x11"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
localzone = "0.3.1"
log = "0.4.34"
memmap2 = "0.9.11"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "gzip", "json", "socks"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-mp3"] }
rquickjs = "0.14.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = "0.44.0"
# Music videos: YouTube's H.264, decoded on the CPU. Built from source; faster with nasm installed.
openh264 = "0.8"
sha1 = "0.10.7"
sha2 = "0.10.9"
hmac = "0.12.1"
serde_json = "1.0.151"
souvlaki = "0.8.3"
tao = "0.37.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
wry = "0.57.0"
rfd = "0.17.2"
tray-icon = "0.26.1"
url = "2.5.8"
# The opt-in renderer: Vulkan, Metal on macOS (renderer.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
mp4ameta = "0.13.0"
md-5 = "0.10"
unicode-normalization = "0.1.26"
symphonia = { version = "0.5.5", default-features = false, features = ["mkv", "aac"] }
mpeg2ts-reader = "0.18.2"
rusty-opus = "1.0.2"
unicode-bidi = "0.3"
# Cutting the tray menu's song line between letters a reader sees as one (tray.rs).
unicode-segmentation = "1.13.3"
# System-wide media shortcuts (hotkeys.rs).
global-hotkey = "0.9"
# The interface in the listener's language, from locales/, built in (i18n.rs).
fluent-templates = "0.15.1"
# The system's languages, for the default one.
sys-locale = "0.3.2"
# Node.js for yt-dlp, fetched when a song first needs it (node.rs): the binary out of
# nodejs.org's .zip (Windows) or .tar.xz (macOS, Linux).
zip = { version = "9.8.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
liblzma = { version = "0.4.9", features = ["static"] }
# AirPlay speakers (airplay.rs): finding them on the network (only with Settings ›
# Network › Allow local network scan on).
mdns-sd = "0.22.0"
# AirPlay 2's transient pairing (SRP over RFC 5054's 3072-bit group) and its
# encryption (airplay/pair.rs).
num-bigint = "0.4.8"
hkdf = "0.12.4"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
# AirPlay 2's requests and answers are binary plists (airplay/ap2.rs).
plist = "1.10.4"

# Recognize song (recognize/): Shazam's signature, and its request's IDs.
realfft = "3.5"
crc32fast = "1.5.2"
uuid = { version = "1.27", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager, for the Google and Spotify sign-ins.
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service (GNOME Keyring, KWallet) for the sign-ins.
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
# The tray icon needs GTK running on a thread of its own.
gtk = "0.18"
# Keeping the computer awake while playing (awake.rs); souvlaki's MPRIS uses it already.
dbus = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain for the sign-ins.
keyring = { version = "3.6.3", features = ["apple-native"] }
# The window's traffic lights on the app's own top row (ui/titlebar.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry", "NSString", "NSUserDefaults"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Recognize song: recording what plays (capture.rs). Newer than rodio's own cpal, for its
# fixed macOS tap (cpal#1123).
cpal = "0.18.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind, not abort: a panic while handling one request (in a library or a parser)
# must fail that request, not close the app.
panic = "unwind"

# Keep debug builds usable: optimize dependencies (decoders, egui) even in dev.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_system_font_provider = "0.37.0"
# Paused time: a stalled download's 20 s pass at once in tests.
tokio = { version = "1.53.2", features = ["test-util"] }

[build-dependencies]
winresource = "0.1.31"

# egui's text layout with one change for right-to-left text (#141): see the ytm-rs notes
# in vendor/epaint/src/text/text_layout.rs.
# souvlaki with its Linux media controls sending changes as they happen, not one a
# second (#144): see the ytm-rs notes in vendor/souvlaki/src/platform/mpris/dbus/controls.rs.
# winit with X11 windows taking a scale that changes after they open (#208) and Windows
# throttling move repaints (~30 fps) and skipping duplicate resize paints in the size/move
# loop so dragging and resizing run at the monitor's refresh rate without freezing video:
# see the ytm-rs notes in vendor/winit/src/platform_impl/linux/x11/window.rs and
# vendor/winit/src/platform_impl/windows/event_loop.rs.
# The X11 backend also requests saved window positions explicitly on KWin so the
# full window's size doesn't constrain where the mini player can go.
# It also hears the X11 settings that come after it connects, and takes the cursor size
# from them (#326): see the ytm-rs notes in vendor/winit/src/platform_impl/linux/x11/xdisplay.rs.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
souvlaki = { path = "vendor/souvlaki" }
winit = { path = "vendor/winit" }
