name: Pull request labels

# Labels each pull request with its size and, where its files make it obvious, its area.
# pull_request_target, so pull requests from forks get labels too. That runs with write
# access, so neither job checks out or runs the pull request's code: the script comes from
# main, and both read the pull request's file list from the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

# A newer push to the same pull request replaces a run still going.
concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    # After area, whatever its outcome: the labeler writes back the whole list of labels it
    # read when it started, so a size label added while it ran would be dropped.
    needs: area
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: await require('./.github/scripts/pr-size.cjs')({ github, context })

  area:
    runs-on: ubuntu-latest
    steps:
      # Its rules come from .github/labeler.yml on main.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
