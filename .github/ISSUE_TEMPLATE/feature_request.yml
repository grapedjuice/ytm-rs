name: Feature request
description: Something the app could do, or do better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One request per issue, please, and [search the existing ones](https://github.com/grapedjuice/ytm-rs/issues?q=is%3Aissue) first: adding a 👍 to one that's already there counts for more than a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation where the app falls short today. This matters more than the solution.
      placeholder: Many remixes are only uploaded as regular videos, and search doesn't show them.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. If YouTube Music or another app already does it, say where, and add a screenshot.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: If it's about one platform or desktop.
      placeholder: "Linux, GNOME on Wayland"
  - type: checkboxes
    id: pr
    attributes:
      label: Pull request
      options:
        - label: I'd like to work on this myself. (For anything large, wait for a reply here before starting.)
