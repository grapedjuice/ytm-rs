name: Tests

# Runs the tests and clippy on every pull request and on main, on Windows and Linux.
# (macOS runs the tests in the release job, before a release is published.)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The same runners the release job builds on.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev

      - name: Test
        run: cargo test --locked

      # Also when a test failed, so one run shows both.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
